<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- The ground is settled before the first paint. React sets data-theme on
         mount, and a mount is one frame too late: a visitor who chose dark
         would watch the page render white and then correct itself. The address
         bar tint follows on mount, where the token that defines it exists. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("dj-theme");
        } catch (ignored) {}
        if (theme !== "light" && theme !== "gray" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!-- The prerendered shell is written for a reader that never runs the
         script: a crawler takes the words out of the source, and a screen
         reader has them before the bundle mounts. On screen it is a stack of
         default-styled links that React throws away a moment later, so it is
         held out of the picture and left in the tree. The rule is inline
         because the stylesheet arrives a round trip after the frame it would
         have to govern. -->
    <style>
      #prerender {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/worksans-latin-var.woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://vjitfkmiwhmalncefrtl.supabase.co" />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/nationalpark-latin-var.woff2"
      crossorigin
    />

    <!-- The hero caps the portrait at 22rem, and at 24rem from the large
         breakpoint up. Described as a share of the viewport instead, a phone
         took the full 1000w file for a 352px slot, which put 30 KB at high
         priority in front of the contour texture the hero actually paints
         from. This pair describes the hero's box and nothing else, so
         prerender drops the preload from every other route; here it and the
         srcset and sizes AgentPortrait renders have to stay identical, or the
         two resolve to different candidates and the portrait is fetched
         twice. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/agent/dylan-jordan-500.webp"
      imagesrcset="/agent/dylan-jordan-500.webp 500w, /agent/dylan-jordan-720.webp 720w, /agent/dylan-jordan.webp 1000w"
      imagesizes="(min-width: 1024px) 24rem, 22rem"
      fetchpriority="high"
    />

    <!-- The contour texture is a CSS background, which the browser cannot ask
         for until the element carrying it has been laid out. That puts the
         widest surface above the fold last in the queue, repainting the hero
         after it is already on screen. The hint is what makes the preload
         worth having: an image preload carrying no priority is scheduled low,
         so the request still queues behind the fonts, the portrait and the
         entry chunk. -->
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="/art/terrain.svg"
      fetchpriority="high"
    />

    <meta property="og:url" content="https://djrxexcellence.com/" />
    <meta

    />

    <script>
      (function () {
        var endpoint = "https://sunday.tail1f78d7.ts.net/report";
        var site = "Dylan Jordan Real Estate";
        var sent = 0;
        // Nothing the page can intercept reaches the visitor's console. Each
        // error is reported first and swallowed second, so the report is made
        // whether or not the suppression holds. What survives is written by the
        // browser's own network layer, which no page script can reach.
        var loud = false;
        var held = [];
        try {
          if (location.search.indexOf("console=on") > -1)
            localStorage.setItem("reporter-console", "1");
          if (location.search.indexOf("console=off") > -1)
            localStorage.removeItem("reporter-console");
          loud = localStorage.getItem("reporter-console") === "1";
        } catch (ignored) {}
        // An extension injects its scripts into the page, so a rejection thrown
        // inside one arrives at this handler with nothing of the site in its
        // stack. A stack naming only extension scripts describes the visitor's
        // browser; one carrying a single site frame is the site's.
        function extensionOnly(stack) {
          var schemes = String(stack || "").match(/[a-z][a-z0-9+.-]*:\/\//gi);
          if (!schemes) return false;
          for (var i = 0; i < schemes.length; i += 1) {
            var scheme = schemes[i].slice(0, -3).toLowerCase();
            if (scheme.slice(-9) !== "extension") return false;
          }
          return true;
        }
        // The browser raises one of these at the window when a ResizeObserver's
        // callbacks are still dirtying layout after its iteration cap, and it
        // carries no stack because no script threw. The notification says
        // delivery was cut short for that frame; the observations left over
        // arrive on the next one, so layout settles either way and the reader
        // sees a page that rendered correctly. Nothing this site ships builds a
        // ResizeObserver, so the loop is never the page's own - it belongs to
        // whatever is driving the browser, and a crawler measuring the document
        // as it paints is the usual one. Reported as an uncaught error it files
        // a defect against a site that has none, so it stays on the page and
        // off the wire. A stack means a script really did throw, and that
        // still reports.
        function resizeObserverNotice(message, stack) {
          if (stack) return false;
          return /^ResizeObserver loop (limit exceeded|completed with undelivered notifications)/.test(
            String(message || "").replace(/^Uncaught\s+/, ""),
          );
        }
        // A request the page makes writes its own failure to the console when it
        // fails, and a collector that cannot be reached would then be the loudest
        // thing on the page. The same request issued inside a worker writes
        // nothing, so reports travel that way while the page is alive.
        var unloading = false;
        var worker = null;
        var workerFailed = false;
        // Taken before the wrapper at the foot of this script replaces it, so
        // asking whether a file is there cannot report itself as a network
        // failure on the way to the answer.
        var rawFetch = window.fetch ? window.fetch.bind(window) : null;
        function transport() {
          if (worker || workerFailed) return worker;
          try {
            var source =
              "self.onmessage=function(e){fetch(e.data.endpoint,{method:'POST',body:e.data.body}).then(function(){},function(){})}";
            worker = new Worker(
              URL.createObjectURL(
                new Blob([source], { type: "text/javascript" }),
              ),
            );
          } catch (ignored) {
            workerFailed = true;
          }
          return worker;
        }
        function send(body) {
          // On the way out the worker dies with the page, and the console goes
          // with it, so the beacon's survival is worth more than its silence.
          if (!unloading) {
            var channel = transport();
            if (channel) {
              channel.postMessage({ endpoint: endpoint, body: body });
              return;
            }
          }
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, body);
          } else {
            fetch(endpoint, {
              method: "POST",
              body: body,
              keepalive: true,
            }).catch(function () {});
          }
        }
        addEventListener("pagehide", function () {
          unloading = true;
        });
        // Everything swallowed stays readable on the page itself, so a live
        // console with the flag off still answers what happened.
        function hold(kind, message, stack) {
          if (held.length < 50)
            held.push({
              kind: kind,
              message: String(message),
              stack: String(stack || ""),
            });
        }
        window.__reporter = {
          held: held,
          replay: function () {
            return held.slice();
          },
        };
        function report(kind, message, stack) {
          hold(kind, message, stack);
          if (sent >= 10) return; // a page stuck in an error loop stops at ten
          if (extensionOnly(stack)) return;
          sent += 1;
          try {
            send(
              JSON.stringify({
                site: site,
                kind: kind,
                message: String(message || "Unknown error").slice(0, 1500),
                stack: String(stack || "").slice(0, 4000),
                url: location.href,
                userAgent: navigator.userAgent,
              }),
            );
          } catch (ignored) {}
        }
        function flatten(args, from) {
          var parts = [];
          for (var i = from; i < args.length; i += 1) {
            var piece = args[i];
            if (piece && piece.stack) {
              parts.push(piece.stack);
            } else if (typeof piece === "object") {
              try {
                parts.push(JSON.stringify(piece));
              } catch (ignored) {
                parts.push(String(piece));
              }
            } else {
              parts.push(String(piece));
            }
          }
          return parts.join(" ");
        }
        // A visitor holding the bundle from an earlier deploy asks the server
        // for a chunk hash the current HTML no longer names, and the request
        // answers 404. Reloading picks up the fresh document with the new
        // hashes and the interaction continues; a failure that survives that
        // reload is a real defect and reaches the queue as one.
        var reloadKey = "dj-stale-reload";
        var recovering = false;
        function staleReload() {
          try {
            if (sessionStorage.getItem(reloadKey)) return false;
            sessionStorage.setItem(reloadKey, "1");
          } catch (ignored) {
            return false;
          }
          location.reload();
          return true;
        }
        // And the marker is given back. It is there to stop a reload looping,
        // so it has to outlive the reload and no longer: left set for the life
        // of the tab, as it was, the first hiccup of a session spends the one
        // recovery a visitor gets and every later one goes straight to the
        // queue with the page still broken. A load that reached the end
        // needing no recovery at all is the proof the document is sound, and
        // it clears the marker.
        addEventListener("load", function () {
          if (recovering) return;
          try {
            sessionStorage.removeItem(reloadKey);
          } catch (ignored) {}
        });
        // A preload, a modulepreload and a prefetch are hints rather than
        // loads. The browser is free to drop one it decides not to keep - a
        // crawler on a resource budget drops them wholesale - and the page
        // then fetches the same file through the import, the stylesheet or the
        // background that actually wanted it. Chrome raises `error` on the
        // discarded link either way, so the event alone says nothing about
        // whether the file is there, and acting on it costs twice over: the
        // report describes a page that rendered perfectly well, and the reload
        // below throws away a document the reader was already looking at.
        var speculative = {
          preload: 1,
          modulepreload: 1,
          prefetch: 1,
          prerender: 1,
        };
        function isHint(node) {
          if (!node.getAttribute || node.tagName.toLowerCase() !== "link")
            return false;
          var rel = String(node.getAttribute("rel") || "")
            .toLowerCase()
            .split(/\s+/);
          for (var i = 0; i < rel.length; i += 1) {
            if (speculative[rel[i]]) return true;
          }
          return false;
        }
        // So ask for the file before calling it missing. This is the same
        // request the page itself would make, cache and all, so a file the
        // browser already holds answers from there; only one that genuinely
        // will not come reaches the queue. A file that answers took `kept`,
        // because the page still lost it for that frame and a live console is
        // owed the reason.
        function ifGone(url, gone, kept) {
          if (!rawFetch) return gone();
          try {
            rawFetch(url, { credentials: "same-origin" }).then(function (
              response,
            ) {
              if (response.ok) {
                if (kept) kept();
              } else {
                gone();
              }
            }, gone);
          } catch (ignored) {
            gone();
          }
        }
        // Capture phase, because element load failures fire error events that do not bubble.
        window.addEventListener(
          "error",
          function (event) {
            try {
              if (
                event.target &&
                event.target !== window &&
                event.target.tagName
              ) {
                var target = event.target.src || event.target.href || "";
                var name = event.target.tagName.toLowerCase();
                // Set here rather than inside the reload, because the check
                // below is a round trip and `load` does not wait for it. A
                // document that cleared the marker and then reloaded would
                // arrive able to clear it again, which is a loop.
                if (target) recovering = true;
                var fail = function () {
                  if (target.indexOf("/assets/") > -1 && staleReload()) return;
                  report("resource", "Failed to load " + name + ": " + target);
                };
                if (target && isHint(event.target)) {
                  // Kept on the page either way, so a live console still
                  // answers what the browser dropped and when.
                  hold("hint", "Dropped hint " + name + ": " + target);
                  ifGone(target, fail);
                  return;
                }
                // The same ambiguity, on the elements that load a file for
                // real. An `error` here means the file is missing or the
                // connection carrying it dropped, and the event does not say
                // which. A dropped connection fails every request in flight
                // on it at the same moment, so one lost second arrives as a
                // page's whole set of images at once rather than as one file.
                // Ask before calling any of them missing - a build asset
                // included. It used to be the exception, on the reasoning
                // that a build asset only ever goes missing when the document
                // naming it is stale, so a reload is the answer and is worth
                // taking straight away. A hashed name that the current
                // document still carries disproves that: the file is there,
                // the document is current, and the reload throws away a page
                // the reader was looking at over one lost second. The reload
                // is still the answer when the file is genuinely gone, which
                // is the only case that reaches `fail` now.
                if (target) {
                  ifGone(target, fail, function () {
                    hold("resource", "Recovered " + name + ": " + target);
                  });
                  return;
                }
                fail();
              } else if (
                resizeObserverNotice(
                  event.message,
                  event.error && event.error.stack,
                )
              ) {
                // Kept on the page either way, so a live console still answers
                // what the browser raised and when.
                hold("resize-observer", event.message);
              } else {
                report(
                  "uncaught",
                  event.message,
                  event.error && event.error.stack,
                );
              }
            } finally {
              if (!loud) event.preventDefault();
            }
          },
          true,
        );
        // Dynamic imports fail as fetches rather than as DOM element loads, so
        // the capture-phase handler above never sees them. Vite raises this
        // event for both paths and the reload mechanism reaches the second one
        // through it.
        window.addEventListener("vite:preloadError", function (event) {
          if (staleReload()) event.preventDefault();
        });
        window.addEventListener("unhandledrejection", function (event) {
          try {
            var reason = event.reason;
            report(
              "rejection",
              reason && reason.message ? reason.message : reason,
              reason && reason.stack,
            );
          } finally {
            if (!loud) event.preventDefault();
          }
        });
        // A library writing to these is addressing whoever maintains the site
        // rather than whoever is reading the page, so the message travels to the
        // Pi instead of to the visitor's console.
        ["error", "warn", "trace"].forEach(function (level) {
          var original = console[level];
          console[level] = function () {
            report("console", flatten(arguments, 0));
            if (loud) original.apply(console, arguments);
          };
        });
        var originalAssert = console.assert;
        console.assert = function (condition) {
          if (condition) return;
          report("console", "Assertion failed: " + flatten(arguments, 1));
          if (loud) originalAssert.apply(console, arguments);
        };
        if (window.fetch) {
          var originalFetch = window.fetch;
          window.fetch = function (input) {
            var target =
              typeof input === "string" ? input : (input && input.url) || "";
            // Reports about the reporter's own request would loop, so the endpoint passes through unwrapped.
            if (target.indexOf(endpoint) === 0)
              return originalFetch.apply(window, arguments);
            return originalFetch.apply(window, arguments).then(
              function (response) {
                if (response.status >= 500)
                  report(
                    "http",
                    "HTTP " + response.status + " from " + target.split("?")[0],
                  );
                return response;
              },
              function (error) {
                report(
                  "network",
                  (error && error.message ? error.message : String(error)) +
                    " fetching " +
                    target.split("?")[0],
                );
                throw error;
              },
            );
          };
        }
      })();
    </script>
    <!-- Traffic analytics. The site key is public by design: it says which
         site a hit belongs to, and the collector accepts it only from this
         site's own origins. Attached after load rather than deferred, so it
         cannot take the main thread from anything a visitor is waiting on. -->
    <script>
      addEventListener("load", function () {
        var tracker = document.createElement("script");
        tracker.src =
          "https://gujgtjqqurildqurpffh.supabase.co/functions/v1/analytics-tracker";
        tracker.dataset.site = "sa_6dedbe1f9144cd2326e96cca1cd57245";
        tracker.crossOrigin = "anonymous";
        tracker.async = true;
        document.head.appendChild(tracker);
      });
    </script>
